name: Release
# Builds the downloadable app on each system. A version tag (v0.2.0) also puts the builds on a DRAFT release, to be
# checked and published by hand. Run it from the Actions tab to just build and download the apps.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Build the interface
        working-directory: ui
        run: npm ci --no-audit --no-fund && npx vite build
      - name: Python packages
        run: pip install -r requirements-build.txt
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "import innisync; print(innisync.__version__)")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "innisync/__init__.py says $v, the tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Build the app
        run: python tools/build_release.py
      - name: Start the built app
        run: python tools/smoke_test.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: InniSync-${{ runner.os }}
          path: dist/InniSync-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum InniSync-* > SHA256SUMS.txt
          title="InniSync ${GITHUB_REF_NAME#v}" && alpha=()
          case "$GITHUB_REF_NAME" in v0.*) title="$title (alpha)"; alpha=(--prerelease) ;; esac   # 0.x is alpha
          gh release create "$GITHUB_REF_NAME" InniSync-* SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --draft \
            "${alpha[@]}" --title "$title" --generate-notes
